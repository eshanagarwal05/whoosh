name: Apply four-finger touchscreen feature

on:
  push:
    branches:
      - feature/touchscreen-four-finger-pinch

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[four-finger-touch-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch touchscreen gestures and docs
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              return text.replace(old, new, 1)

          path = Path('extension/touchscreen.js')
          text = path.read_text()

          text = replace_once(
              text,
              "const TAP_REPLAY_GUARD_US = 250_000;\n",
              "const TAP_REPLAY_GUARD_US = 250_000;\n\n"
              "const FOUR_FINGER_TOUCH_COUNT = 4;\n"
              "const FOUR_FINGER_PINCH_IN_SCALE = 0.72;\n"
              "const FOUR_FINGER_PINCH_OUT_SCALE = 1.28;\n"
              "const FOUR_FINGER_MIN_SPREAD = 24;\n",
              'touchscreen constants',
          )

          text = replace_once(
              text,
              "        this._gestureCounter = 0;\n",
              "        this._gestureCounter = 0;\n\n"
              "        this._touchPoints = new Map();\n"
              "        this._fourFingerGesture = null;\n"
              "        this._fourFingerOwnsGrab = false;\n",
              'constructor multitouch state',
          )

          text = replace_once(
              text,
              "        this._state = STATE_IDLE;\n"
              "        this._session = null;\n"
              "    }\n\n"
              "    _handleCapturedEvent(event) {\n",
              "        this._touchPoints.clear();\n"
              "        this._fourFingerGesture = null;\n"
              "        this._fourFingerOwnsGrab = false;\n\n"
              "        this._state = STATE_IDLE;\n"
              "        this._session = null;\n"
              "    }\n\n"
              "    _handleCapturedEvent(event) {\n",
              'disable multitouch cleanup',
          )

          text = replace_once(
              text,
              "            return false;\n"
              "        }\n\n"
              "        if (type === Clutter.EventType.KEY_PRESS ||\n",
              "            return false;\n"
              "        }\n\n"
              "        this._observeFourFingerTouch(event);\n\n"
              "        if (type === Clutter.EventType.KEY_PRESS ||\n",
              'captured multitouch observer',
          )

          old_stage = """    _handleStageTouchEvent(event) {
        if (!this._session || !this._inputGrab)
            return false;

        const type = event.type();

        // A second finger does not participate in the active throw.
        if (type === Clutter.EventType.TOUCH_BEGIN)
            return true;
"""
          new_stage = """    _handleStageTouchEvent(event) {
        if (!this._inputGrab)
            return false;

        const type = event.type();
        this._observeFourFingerTouch(event);

        if (!this._session) {
            if (!this._fourFingerOwnsGrab)
                return false;

            if (this._touchPoints.size === 0) {
                this._fourFingerOwnsGrab = false;
                this._releaseInputGrab();
            }

            return true;
        }

        if (type === Clutter.EventType.TOUCH_BEGIN) {
            if (this._touchPoints.size > 1)
                this._upgradeSingleTouchToMultitouch();

            return true;
        }
"""
          text = replace_once(text, old_stage, new_stage, 'stage multitouch handling')

          methods = r"""
    _touchSequenceKey(event) {
        const sequence = event.get_event_sequence?.();
        if (!sequence)
            return null;

        try {
            const slot = sequence.get_slot();
            if (Number.isInteger(slot))
                return slot;
        } catch (_) {
        }

        return sequence;
    }

    _fourFingerGeometry() {
        if (this._touchPoints.size !== FOUR_FINGER_TOUCH_COUNT)
            return null;

        const points = [...this._touchPoints.values()];
        let x = 0;
        let y = 0;

        for (const point of points) {
            x += point.x;
            y += point.y;
        }

        x /= points.length;
        y /= points.length;

        let spread = 0;
        for (const point of points)
            spread += Math.hypot(point.x - x, point.y - y);

        spread /= points.length;
        return {x, y, spread};
    }

    _beginFourFingerGesture() {
        const geometry = this._fourFingerGeometry();
        if (!geometry || geometry.spread < FOUR_FINGER_MIN_SPREAD)
            return;

        const win = this._getWindowAt(geometry.x, geometry.y);
        if (!win || win.is_hidden())
            return;

        this._fourFingerGesture = {
            window: win,
            baseSpread: geometry.spread,
            minScale: 1,
            maxScale: 1,
            cancelled: false,
        };
    }

    _updateFourFingerGesture() {
        const gesture = this._fourFingerGesture;
        const geometry = this._fourFingerGeometry();

        if (!gesture || !geometry || gesture.baseSpread <= 0)
            return;

        const scale = geometry.spread / gesture.baseSpread;
        gesture.minScale = Math.min(gesture.minScale, scale);
        gesture.maxScale = Math.max(gesture.maxScale, scale);
    }

    _finishFourFingerGesture() {
        const gesture = this._fourFingerGesture;
        this._fourFingerGesture = null;

        if (!gesture || gesture.cancelled)
            return;

        const pinchedIn =
            gesture.minScale <= FOUR_FINGER_PINCH_IN_SCALE;
        const pinchedOut =
            gesture.maxScale >= FOUR_FINGER_PINCH_OUT_SCALE;

        if (!pinchedIn && !pinchedOut)
            return;

        const inwardTravel = 1 - gesture.minScale;
        const outwardTravel = gesture.maxScale - 1;
        const action =
            pinchedIn && (!pinchedOut || inwardTravel >= outwardTravel)
                ? 'close'
                : 'fullscreen';
        const win = gesture.window;

        let sourceId = 0;
        sourceId = GLib.idle_add(
            GLib.PRIORITY_DEFAULT_IDLE,
            () => {
                this._applySources.delete(sourceId);

                try {
                    if (!win || win.is_hidden())
                        return GLib.SOURCE_REMOVE;

                    const time = global.display.get_current_time();

                    if (action === 'close') {
                        if (win.can_close())
                            win.delete(time);
                    } else {
                        if (!win.is_fullscreen())
                            win.make_fullscreen();

                        if (!win.has_focus())
                            win.activate(time);
                    }
                } catch (error) {
                    console.error(
                        `Whoosh four-finger touchscreen action failed: ${error}`
                    );
                }

                return GLib.SOURCE_REMOVE;
            }
        );

        this._applySources.add(sourceId);
    }

    _observeFourFingerTouch(event) {
        const type = event.type();
        const isTouch =
            type === Clutter.EventType.TOUCH_BEGIN ||
            type === Clutter.EventType.TOUCH_UPDATE ||
            type === Clutter.EventType.TOUCH_END ||
            type === Clutter.EventType.TOUCH_CANCEL;

        if (!isTouch)
            return;

        const key = this._touchSequenceKey(event);
        if (key === null)
            return;

        const [x, y] = event.get_coords();

        if (type === Clutter.EventType.TOUCH_BEGIN) {
            this._touchPoints.set(key, {x, y});
        } else if (this._touchPoints.has(key)) {
            this._touchPoints.set(key, {x, y});
        } else {
            return;
        }

        if (this._touchPoints.size > FOUR_FINGER_TOUCH_COUNT &&
            this._fourFingerGesture) {
            this._fourFingerGesture.cancelled = true;
        }

        if (!this._fourFingerGesture &&
            this._touchPoints.size === FOUR_FINGER_TOUCH_COUNT) {
            this._beginFourFingerGesture();
        }

        if (this._fourFingerGesture &&
            this._touchPoints.size === FOUR_FINGER_TOUCH_COUNT) {
            this._updateFourFingerGesture();
        }

        if (type !== Clutter.EventType.TOUCH_END &&
            type !== Clutter.EventType.TOUCH_CANCEL) {
            return;
        }

        if (type === Clutter.EventType.TOUCH_CANCEL &&
            this._fourFingerGesture) {
            this._fourFingerGesture.cancelled = true;
        }

        this._touchPoints.delete(key);

        if (this._touchPoints.size === 0) {
            if (this._fourFingerGesture)
                this._finishFourFingerGesture();

            this._touchPoints.clear();
        }
    }

    _upgradeSingleTouchToMultitouch() {
        const session = this._session;
        if (!session)
            return;

        const now = GLib.get_monotonic_time();
        session.pendingCommit = null;
        session.cancelled = true;
        session.endedAtUs = now;
        session.durationMs = (now - session.startedAtUs) / 1000;
        session.outcome = 'multitouch';

        this._recordEvent(
            session,
            'multitouch-upgrade',
            now
        );

        this._state = STATE_IDLE;
        this._session = null;
        this._fourFingerOwnsGrab = true;
        this._finishSession(session);
    }

"""
          text = replace_once(
              text,
              "    _handleTouchBegin(event) {\n",
              methods + "    _handleTouchBegin(event) {\n",
              'four-finger methods',
          )

          path.write_text(text)

          readme = Path('README.md')
          docs = readme.read_text()
          docs = replace_once(
              docs,
              "Whoosh brings two-finger window and GNOME dash gestures to GNOME Shell 50.\n",
              "Whoosh brings two-finger touchpad gestures and touchscreen window controls to GNOME Shell 50.\n",
              'readme intro',
          )
          touchscreen_section = """### Touchscreen controls

| Gesture over a visible window | Action |
|---|---|
| Four-finger pinch / swipe in | Close the window |
| Four-finger pinch / swipe out | Fullscreen the window |

Four-finger touchscreen gestures can begin anywhere over the visible window, not just the title bar. Whoosh tracks the spread of all four contacts so moving four fingers together does not count as a pinch, and the action is applied after the fingers are released.

"""
          docs = replace_once(
              docs,
              "### GNOME dash and Dash to Dock\n",
              touchscreen_section + "### GNOME dash and Dash to Dock\n",
              'readme touchscreen section',
          )
          docs = replace_once(
              docs,
              "- a touchpad exposed through libinput\n",
              "- a touchpad exposed through libinput\n- a touchscreen for the optional four-finger touchscreen controls\n",
              'readme touchscreen requirement',
          )
          docs = replace_once(
              docs,
              "recognizes gestures, and emits action names over the system D-Bus. The GNOME\nShell extension performs the actual window operations.\n",
              "recognizes gestures, and emits action names over the system D-Bus. The GNOME\nShell extension performs the actual window operations. Four-finger touchscreen\npinches are recognized directly by the extension from Clutter touch sequences.\n",
              'readme architecture',
          )
          readme.write_text(docs)

          metadata_path = Path('extension/metadata.json')
          metadata = json.loads(metadata_path.read_text())
          metadata['description'] = (
              "Touchpad window and GNOME dash gestures plus touchscreen controls for GNOME Shell. "
              "Swipe title bars to tile, maximize, or minimize; pinch to close or fullscreen. "
              "On a touchscreen, pinch four fingers inward anywhere over a visible window to close it, "
              "or spread four fingers outward to fullscreen it. In GNOME Overview, hover a window preview "
              "and use two-finger swipes to tile, maximize, minimize, or corner-tile that window; pinch in "
              "to close its application and pinch out to move that exact window to a new workspace. "
              "Touchscreen title-bar drags support release-to-tile gestures, corner tiling, and dragging "
              "windows out of maximized state. Over dash apps, swipe up to maximize the preferred window, "
              "swipe down to minimize all windows, pinch in to quit, and pinch out to open a new window on "
              "a new workspace.\n\nRequires the Whoosh backend from the project repository."
          )
          metadata['version-name'] = '1.11.0'
          metadata_path.write_text(json.dumps(metadata, indent=2) + '\n')
          PY

      - name: Validate
        shell: bash
        run: |
          cp extension/touchscreen.js /tmp/touchscreen.mjs
          node --check /tmp/touchscreen.mjs
          python3 -m py_compile backend/whoosh-backend.py
          bash -n backend/install.sh
          bash -n backend/uninstall.sh
          make extension-zip

      - name: Commit feature
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extension/touchscreen.js extension/metadata.json README.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add four-finger touchscreen pinch controls [four-finger-touch-applied]"
          git push
